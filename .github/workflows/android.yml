name: WordFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar WordFlow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace

      - name: Diagnosticar APK y clases
        shell: bash
        run: |
          echo '=== ARCHIVOS APK ==='
          find app/build/outputs -type f -name '*.apk' -exec ls -lh {} \; || true
          echo '=== ARCHIVOS DEX ==='
          find app/build -type f -name 'classes*.dex' -exec ls -lh {} \; || true
          echo '=== CLASES JAVA COMPILADAS ==='
          find app/build -type f -name '*.class' | head -40
          echo '=== CONTENIDO DEL APK ==='
          APK='app/build/outputs/apk/debug/app-debug.apk'
          if [ ! -f "$APK" ]; then
            echo 'ERROR: No se encontro el APK.'
            exit 1
          fi
          stat -c 'Tamano del APK: %s bytes' "$APK"
          unzip -l "$APK"
          unzip -t "$APK"
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 100000 ]; then
            echo 'DIAGNOSTICO: APK demasiado pequeno; revisar archivos DEX y clases compiladas.'
            exit 1
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WordFlow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
