
name: WordFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar WordFlow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug

      - name: Verificar APK real
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontro el APK."
            find app/build/outputs -type f
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "Tamano del APK: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: El APK es demasiado pequeno."
            exit 1
          fi
          file "$APK"
          unzip -t "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WordFlow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
