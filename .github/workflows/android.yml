name: WordFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar WordFlow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace

      # A persistent signing key makes future APKs update-compatible with
      # each other. Never commit the keystore or its passwords to the repo.
      - name: Firmar con clave persistente (si está configurada)
        id: signing
        shell: bash
        env:
          WORD_FLOW_KEYSTORE_BASE64: ${{ secrets.WORD_FLOW_KEYSTORE_BASE64 }}
          WORD_FLOW_KEYSTORE_PASSWORD: ${{ secrets.WORD_FLOW_KEYSTORE_PASSWORD }}
          WORD_FLOW_KEY_ALIAS: ${{ secrets.WORD_FLOW_KEY_ALIAS }}
          WORD_FLOW_KEY_PASSWORD: ${{ secrets.WORD_FLOW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          if [ -n "${WORD_FLOW_KEYSTORE_BASE64:-}" ] && [ -n "${WORD_FLOW_KEYSTORE_PASSWORD:-}" ] && [ -n "${WORD_FLOW_KEY_ALIAS:-}" ] && [ -n "${WORD_FLOW_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/wordflow-signing.jks"
            SIGNED="$RUNNER_TEMP/app-debug-signed.apk"
            printf '%s' "$WORD_FLOW_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            if [ -z "$APKSIGNER" ]; then
              echo 'ERROR: No se encontró apksigner.'
              exit 1
            fi
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$WORD_FLOW_KEY_ALIAS" \
              --ks-pass env:WORD_FLOW_KEYSTORE_PASSWORD \
              --key-pass env:WORD_FLOW_KEY_PASSWORD \
              --out "$SIGNED" "$APK"
            mv "$SIGNED" "$APK"
            rm -f "$KEYSTORE"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo 'APK firmado con la clave persistente configurada.'
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'AVISO: No hay clave persistente configurada; no se publicará este APK como actualización instalable.'
            echo 'La compilación se valida, pero no se genera un artefacto para instalar hasta configurar la clave persistente.'
          fi

      - name: Verificar APK y firma
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          if [ ! -f "$APK" ]; then
            echo 'ERROR: No se encontro el APK.'
            find app/build/outputs -type f || true
            exit 1
          fi
          echo '=== TAMANO DEL APK ==='
          stat -c '%s bytes' "$APK"
          echo '=== VERIFICAR ARCHIVO ==='
          unzip -t "$APK"
          echo '=== VERIFICAR CODIGO DEX ==='
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?\.dex$'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo 'Verificacion del APK completada.'

      - name: Guardar APK firmado para actualización
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WordFlow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
