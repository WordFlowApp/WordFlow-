name: WordFlow Android APK
# Build after stable-signing secret setup; each artifact records signature mode.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/floating-window-neon-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and identify WordFlow APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORDFLOW_SIGNING_BUNDLE: ${{ secrets.WORDFLOW_SIGNING_BUNDLE }}

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare persistent beta signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORDFLOW_SIGNING_BUNDLE:-}" && "$WORDFLOW_SIGNING_BUNDLE" == *'|'* ]]; then
            KEYSTORE_B64="${WORDFLOW_SIGNING_BUNDLE%%|*}"
            KEYSTORE_PASSWORD="${WORDFLOW_SIGNING_BUNDLE#*|}"
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/wordflow-beta.jks"
            echo "WORDFLOW_KEYSTORE_PATH=$RUNNER_TEMP/wordflow-beta.jks" >> "$GITHUB_ENV"
            echo "WORDFLOW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo 'Persistent beta signing key configured.'
          else
            echo 'Persistent signing secret is not configured; this APK will use a temporary debug signature and must not be used for repeat-update testing.'
          fi
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace

      - name: Verify APK and make uniquely named package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$SOURCE_APK"
          unzip -t "$SOURCE_APK"
          unzip -Z1 "$SOURCE_APK" | grep -Eq '^classes([0-9]+)?\.dex$'
          mkdir -p dist
          OUT="dist/WordFlow-0.3.3-build$GITHUB_RUN_NUMBER.apk"
          cp "$SOURCE_APK" "$OUT"
          sha256sum "$OUT" | tee dist/SHA256SUMS.txt
          {
            echo 'versionName=0.3.3'
            echo 'versionCode=6'
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_NUMBER"
            echo "apk=$OUT"
            if [[ -n "${WORDFLOW_KEYSTORE_PATH:-}" ]]; then echo 'signing=persistent-beta'; else echo 'signing=temporary-debug'; fi
          } | tee dist/BUILD-INFO.txt
          echo "APK generated from commit $GITHUB_SHA"

      - name: Upload uniquely named APK and verification details
        uses: actions/upload-artifact@v4
        with:
          name: WordFlow-0.3.3-build-${{ github.run_number }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
