name: WordFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - wordflow2-clean-start
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar WordFlow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar catalogo de 18 idiomas
        shell: bash
        run: |
          set -e
          SOURCE='app/src/main/java/com/wordflow/app/OverlayService.java'
          COUNT="$(grep -c 'new Language(' "$SOURCE")"
          echo "Idiomas encontrados: $COUNT"
          test "$COUNT" -eq 18
          grep -q 'RecognizerIntent.EXTRA_LANGUAGE, sourceLanguage.localeTag' "$SOURCE"
          grep -q 'Locale.forLanguageTag(targetLanguage.localeTag)' "$SOURCE"
          ! grep -q 'northToArgentine' "$SOURCE"
          echo 'Verificacion del catalogo y locales completada.'

      - name: Verificar identidad e icono WordFlow Real
        shell: bash
        run: |
          set -e
          grep -q 'android:label="Word Flow"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_wordflow"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/ic_wordflow_foreground.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_wordflow.xml
          test -s app/src/main/res/values/wordflow_icon.xml
          grep -q 'USA flag bubble' app/src/main/res/drawable/ic_wordflow_foreground.xml
          grep -q 'Argentina flag bubble' app/src/main/res/drawable/ic_wordflow_foreground.xml
          ! find app/src/main/res/mipmap-* -name 'ic_wordflow.png' | grep -q .
          grep -q "applicationId 'com.wordflow2.app.test'" app/build.gradle
          grep -q "versionName '3.1'" app/build.gradle
          echo 'Identidad e icono de Word Flow 3.0 verificados.'

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace

      - name: Verificar APK y codigo
        shell: bash
        run: |
          set -e
          APK='app/build/outputs/apk/debug/app-debug.apk'
          if [ ! -f "$APK" ]; then
            echo 'ERROR: No se encontro el APK.'
            find app/build/outputs -type f || true
            exit 1
          fi
          echo '=== TAMANO DEL APK ==='
          stat -c '%s bytes' "$APK"
          echo '=== VERIFICAR ARCHIVO ==='
          unzip -t "$APK"
          echo '=== VERIFICAR CODIGO DEX ==='
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex'
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?\.dex$'
          echo 'Verificacion del APK completada.'

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WordFlow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
