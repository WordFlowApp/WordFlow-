plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wordflow.app'
    compileSdk 35

    defaultConfig {
        // Keep the existing installed package so this APK updates the same app.
        applicationId 'com.wordflow2.app.test'
        versionCode 4
        versionName '3.1'
        minSdk 26
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
