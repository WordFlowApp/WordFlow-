plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wordflow.app'
    compileSdk 35

    defaultConfig {
        // Initial public-facing app identity for WordFlow Real.
        applicationId 'com.wordflow.real'
        versionCode 1
        versionName '1.0.0'
        minSdk 26
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
