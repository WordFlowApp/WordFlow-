plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wordflow.app'
    compileSdk 35

    defaultConfig {
        // Side-by-side test package: preserves the user's installed WordFlow 2.
        applicationId 'com.wordflow2.app'
        applicationIdSuffix '.test'
        versionCode 137
        versionName '2.1.4-test'
        minSdk 26
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
