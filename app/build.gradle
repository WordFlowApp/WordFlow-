plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wordflow.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wordflow2.app'
        minSdk 26
        targetSdk 35
        versionCode 137
        versionName '2.1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
